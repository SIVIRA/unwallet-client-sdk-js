name: test
on:
  push:
    branches:
      - "**"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install dependencies
        run: make deps
      - name: Test
        run: make test
        env:
          APP_TEST_FLAGS: --coverage
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
